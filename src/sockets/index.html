<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; background: yellow; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button type="submit">Send</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io({

    auth:{
      token: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjRhOWY4MzM2LWU1MTQtNGFmNC04MzE4LTUwMDMzZmI4MDI2NCIsImlhdCI6MTc4ODk4NDg2NCwiZXhwIjoxNzg4OTg4NDY0fQ.4Sld4sHXFUGrPsdtUFfBCxBpRK-N2uvTVSsveDfvZ0U"
    }
  });
  const currentprojectId = 'project-123';

  // 1. Automatically join the room when the connection opens
  socket.on('connect', () => {
      socket.emit('join project', currentprojectId);
  });
  
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const messages = document.getElementById('messages');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value) {
      socket.timeout(5000).emit('chat message', {
        msg: input.value,
        projectID: currentprojectId
      }, (err,response) => {
        
        if(err){
          return console.error('Server acknowledged, but sent no data payload');
        }
        if(response.status ==='ok'){
          console.log("Server confirmed receipt at:", response.timestamp);
        }
      });
      input.value = '';
    }
  }); 

  socket.on('chat message', data => {

    const item = document.createElement('li');
      item.textContent = data.msg;
      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);    
  });

  socket.on('connect_error', err => {
    console.error("Couldn't connect", err);
  })
  
</script>
  </body>
</html>
